      <stop offset="0" stop-color="#09090b"/>
      <stop offset="1" stop-color="#15161b"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ef3d55"/>
      <stop offset="1" stop-color="#ff7185"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".42"/>
    </filter>
  </defs>

  <rect width="1280" height="360" rx="28" fill="url(#surface)"/>
  <path d="M0 44H760M0 316H980M1020 0V360M1082 0V360" stroke="#24262e" stroke-width="1"/>
  <path d="M70 0V360M0 104H1280" stroke="#1c1e24" stroke-width="1"/>
  <path d="M0 359H1280" stroke="#ef3d55" stroke-width="2"/>

