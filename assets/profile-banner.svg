<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Eduardo Spiess — Founder at VEX</title>
  <desc id="desc">Animated dark profile banner for Eduardo Spiess, focused on AI agents, automation and web systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070709"/>
      <stop offset="0.55" stop-color="#101116"/>
      <stop offset="1" stop-color="#17181d"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b3122b"/>
      <stop offset="0.5" stop-color="#ef3d55"/>
      <stop offset="1" stop-color="#ff7185"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ef3d55" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ef3d55" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>

  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>

  <g opacity=".25" stroke="#34363f" stroke-width="1">
    <path d="M0 72H1280M0 144H1280M0 216H1280M0 288H1280"/>
    <path d="M160 0V360M320 0V360M480 0V360M640 0V360M800 0V360M960 0V360M1120 0V360"/>
  </g>

  <circle cx="1000" cy="60" r="180" fill="url(#glow)" filter="url(#blur)">
    <animate attributeName="cx" values="980;1120;980" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="80;250;80" dur="10s" repeatCount="indefinite"/>
  </circle>

  <g fill="none" stroke="#ef3d55" stroke-linecap="round">
    <path d="M930 95 C1010 35 1110 45 1190 120" opacity=".35" stroke-width="2" stroke-dasharray="8 14">
      <animate attributeName="stroke-dashoffset" values="0;-220" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M900 270 C1000 205 1110 210 1215 278" opacity=".2" stroke-width="2" stroke-dasharray="5 12">
      <animate attributeName="stroke-dashoffset" values="0;180" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>

  <g>
    <circle r="4" fill="#ef3d55">
      <animateMotion dur="7s" repeatCount="indefinite" path="M930 95 C1010 35 1110 45 1190 120"/>
    </circle>
    <circle r="3" fill="#ffffff">
      <animateMotion dur="8s" repeatCount="indefinite" path="M900 270 C1000 205 1110 210 1215 278"/>
    </circle>
  </g>

  <rect x="64" y="48" width="208" height="34" rx="17" fill="#17181d" stroke="#31333d"/>
  <circle cx="84" cy="65" r="5" fill="#ef3d55">
    <animate attributeName="opacity" values=".35;1;.35" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="99" y="71" fill="#d8dae2" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.7">SANTA CATARINA · BR</text>

  <text x="64" y="161" fill="#f7f7f5" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800" letter-spacing="-2">Eduardo Spiess</text>
  <text x="66" y="207" fill="#ef3d55" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Founder @ VEX</text>
  <text x="66" y="248" fill="#b9bbc4" font-family="Arial, Helvetica, sans-serif" font-size="20">AI Agents · Automation · Web Systems</text>
  <text x="66" y="285" fill="#777a84" font-family="Arial, Helvetica, sans-serif" font-size="16">Building software that gives time back to people.</text>

  <g transform="translate(985 142)">
    <rect x="0" y="0" width="205" height="96" rx="18" fill="#111217" stroke="#2d2f37"/>
    <text x="22" y="32" fill="#777a84" font-family="monospace" font-size="12">VEX / STATUS</text>
    <text x="22" y="59" fill="#f5f5f4" font-family="monospace" font-size="15">BUILDING</text>
    <rect x="22" y="72" width="160" height="4" rx="2" fill="#262832"/>
    <rect x="22" y="72" width="45" height="4" rx="2" fill="url(#red)">
      <animate attributeName="width" values="28;160;28" dur="4.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="0" y="357" width="1280" height="3" fill="url(#red)">
    <animate attributeName="opacity" values=".5;1;.5" dur="2.6s" repeatCount="indefinite"/>
  </rect>
</svg>
