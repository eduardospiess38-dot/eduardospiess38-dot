<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Eduardo Spiess — Fullstack e LLM Engineer</title>
  <desc id="desc">Banner escuro com identidade VEX, nome de Eduardo Spiess e especialidades em software, RAG e agentes de IA.</desc>
  <defs>
